spring.application.name=Lab1

# OpenAPI UI på /swagger-ui.html (tillhandahålls av springdoc)

# Externa LLM-inställningar
#
# Du kan sätta dessa via miljövariabler i stället för att hårdkoda i properties.
# Spring Boot mappar automatiskt ENV-variabler till properties, och nedan rader
# använder placeholders så att ENV prioriteras om de finns.
#
# PowerShell-exempel (sätt i samma fönster före start):
#   $env:LLM_BASE_URL = "http://localhost:1234/v1/chat/completions"
#   $env:LLM_MODEL    = "llama-3.2-3b-instruct"
#   .\gradlew.bat bootRun
#
# IntelliJ: Run/Debug Configurations -> Environment variables -> lägg till
#   LLM_BASE_URL, LLM_MODEL och ev. LLM_API_KEY

# Bas-URL till OpenAI-kompatibel chat/completions-endpoint
llm.base-url=${LLM_BASE_URL:http://localhost:1234/v1/chat/completions}

# API-nyckel om din leverantör kräver det (lämna tomt lokalt med LM Studio/Ollama)
llm.api-key=${LLM_API_KEY:}

# Modellnamn hos leverantören. Standard om inget anges.
llm.model=${LLM_MODEL:llama-3.2-3b-instruct}

# Konfigurerbara timeouts (ms) ? kan överstyras via ENV
llm.connect-timeout-ms=${LLM_CONNECT_TIMEOUT_MS:2000}
llm.read-timeout-ms=${LLM_READ_TIMEOUT_MS:60000}
